name: Build and publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose files
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: qualityhub_ci
          MYSQL_USER: qualityhub_ci
          MYSQL_PASSWORD: qualityhub_ci_password
          DOCUMENTS_PATH: /tmp/qualityhub-documents
          AI_MODEL_PATH: /tmp/qualityhub-model
        run: |
          mkdir -p "$DOCUMENTS_PATH" "$AI_MODEL_PATH"
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.external-db.yml config --quiet

  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/hidayahmf/qualityhub:main
