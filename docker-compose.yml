services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bmc-smartfind:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: BMC SmartFind
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-bmc_smartfind}
      DB_USERNAME: ${DB_USERNAME:-bmc}
      DB_PASSWORD: ${DB_PASSWORD:-bmc_local_password}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      BMC_STORAGE_PATH: /mnt/documents
      AI_SMART_SEARCH_ENABLED: ${AI_SMART_SEARCH_ENABLED:-false}
      AI_SMART_SEARCH_URL: http://ai:8765
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
      - ${DOCUMENTS_PATH:-../../BMC_Data/SmartFindDocuments}:/mnt/documents
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-bmc_smartfind}
      MARIADB_USER: ${DB_USERNAME:-bmc}
      MARIADB_PASSWORD: ${DB_PASSWORD:-bmc_local_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: bmc-smartfind-ai:local
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      AI_MODEL_PATH: /models/multilingual-e5-small
    volumes:
      - ${AI_MODEL_PATH:-../../BMC_AI/Models/multilingual-e5-small}:/models/multilingual-e5-small:ro

volumes:
  db_data:
  app_storage:
  app_logs:
