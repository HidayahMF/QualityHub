services:
  app:
    image: ${APP_IMAGE:-ghcr.io/hidayahmf/qualityhub:main}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: BMC SmartFind
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_LOCALE: ${APP_LOCALE:-id}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-id}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-id_ID}
      DB_CONNECTION: mysql
      DB_HOST: ${MYSQL_HOST:?MYSQL_HOST is required}
      DB_PORT: ${MYSQL_PORT:-3306}
      DB_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SESSION_DRIVER: database
      SESSION_LIFETIME: ${SESSION_LIFETIME:-180}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
      SESSION_PATH: ${SESSION_PATH:-/}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_PARTITIONED_COOKIE: ${SESSION_PARTITIONED_COOKIE:-false}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      BMC_STORAGE_PATH: /mnt/documents
      SMARTFIND_SAME_ORIGIN_ENABLED: ${SMARTFIND_SAME_ORIGIN_ENABLED:-false}
      SMARTFIND_CSP_ENABLED: ${SMARTFIND_CSP_ENABLED:-true}
      SMARTFIND_HSTS_ENABLED: ${SMARTFIND_HSTS_ENABLED:-false}
      SMARTFIND_CORS_PATHS: ${SMARTFIND_CORS_PATHS:-}
      SMARTFIND_CORS_ALLOWED_ORIGINS: ${SMARTFIND_CORS_ALLOWED_ORIGINS:-}
      SMARTFIND_REMEMBER_LOGIN_ENABLED: ${SMARTFIND_REMEMBER_LOGIN_ENABLED:-false}
      SMARTFIND_LOGIN_MAX_ATTEMPTS: ${SMARTFIND_LOGIN_MAX_ATTEMPTS:-5}
      SMARTFIND_LOGIN_DECAY_SECONDS: ${SMARTFIND_LOGIN_DECAY_SECONDS:-300}
      SMARTFIND_LOGIN_IP_MAX_ATTEMPTS: ${SMARTFIND_LOGIN_IP_MAX_ATTEMPTS:-20}
      SMARTFIND_LOGIN_IP_DECAY_SECONDS: ${SMARTFIND_LOGIN_IP_DECAY_SECONDS:-300}
      SMARTFIND_PASSWORD_MIN_LENGTH: ${SMARTFIND_PASSWORD_MIN_LENGTH:-12}
      SMARTFIND_PASSWORD_MAX_LENGTH: ${SMARTFIND_PASSWORD_MAX_LENGTH:-128}
      SMARTFIND_IDLE_TIMEOUT_MINUTES: ${SMARTFIND_IDLE_TIMEOUT_MINUTES:-60}
      SMARTFIND_ABSOLUTE_SESSION_TIMEOUT_MINUTES: ${SMARTFIND_ABSOLUTE_SESSION_TIMEOUT_MINUTES:-720}
      SMARTFIND_MAX_CONCURRENT_SESSIONS: ${SMARTFIND_MAX_CONCURRENT_SESSIONS:-3}
      SMARTFIND_SESSION_PASSWORD_FINGERPRINT: ${SMARTFIND_SESSION_PASSWORD_FINGERPRINT:-true}
      AI_SMART_SEARCH_ENABLED: ${AI_SMART_SEARCH_ENABLED:-false}
      AI_SMART_SEARCH_URL: ${AI_SMART_SEARCH_URL:-http://127.0.0.1:8765}
      AI_SMART_SEARCH_CONNECT_TIMEOUT: ${AI_SMART_SEARCH_CONNECT_TIMEOUT:-1}
      AI_SMART_SEARCH_TIMEOUT: ${AI_SMART_SEARCH_TIMEOUT:-5}
      AI_SMART_SEARCH_TOP_K: ${AI_SMART_SEARCH_TOP_K:-20}
      AI_SMART_SEARCH_CANDIDATE_LIMIT: ${AI_SMART_SEARCH_CANDIDATE_LIMIT:-250}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-BMC SmartFind}
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
      - ${DOCUMENTS_PATH:?DOCUMENTS_PATH is required}:/mnt/documents
    networks:
      - qualityhub

volumes:
  app_storage:
  app_logs:

networks:
  qualityhub:
